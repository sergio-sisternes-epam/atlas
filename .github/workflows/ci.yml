name: Atlas CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install Python dependencies
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Run repository test suite
        run: python3 scripts/run_tests.py
      - name: Check release version surfaces
        run: python3 scripts/release_readiness.py --commit "$GITHUB_SHA"

  package:
    name: APM package integrity
    needs: test
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1
        with:
          apm-version: "0.29.0"
          setup-only: true
      - name: Require private dependency credential
        env:
          APM_READ_TOKEN: ${{ secrets.APM_READ_TOKEN }}
        run: |
          if [ -z "$APM_READ_TOKEN" ]; then
            echo "::error title=Missing APM credential::Configure the APM_READ_TOKEN Actions secret with Contents: read access to Atlas and OKF."
            exit 1
          fi
      - name: Restore frozen dependencies
        if: github.event_name != 'pull_request'
        env:
          GITHUB_APM_PAT_SERGIO_SISTERNES_EPAM: ${{ secrets.APM_READ_TOKEN }}
        run: apm install --frozen --target agent-skills
      - name: Audit committed APM state
        if: github.event_name == 'pull_request'
        env:
          GITHUB_APM_PAT_SERGIO_SISTERNES_EPAM: ${{ secrets.APM_READ_TOKEN }}
        run: apm audit --ci --no-policy --no-fail-fast --no-drift
      - name: Audit restored source integrity
        if: github.event_name != 'pull_request'
        env:
          GITHUB_APM_PAT_SERGIO_SISTERNES_EPAM: ${{ secrets.APM_READ_TOKEN }}
        run: apm audit --ci --no-policy --no-fail-fast --no-drift

  consumer:
    name: Consumer install (${{ matrix.name }})
    needs: package
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-skills
            target: agent-skills
          - name: stable-runtimes
            target: claude,codex,copilot,cursor,gemini,grok-build,kiro,opencode,windsurf
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1
        with:
          apm-version: "0.29.0"
          setup-only: true
      - name: Install checked-out package into a disposable consumer
        env:
          GITHUB_APM_PAT_SERGIO_SISTERNES_EPAM: ${{ secrets.APM_READ_TOKEN }}
          TARGETS: ${{ matrix.target }}
        run: |
          consumer="$RUNNER_TEMP/atlas-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          apm install "$GITHUB_WORKSPACE" --target "$TARGETS"
          test -f .agents/skills/atlas/SKILL.md
          apm audit --ci --no-policy --no-fail-fast

  readiness:
    name: Release readiness decision
    needs:
      - test
      - package
      - consumer
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Record candidate decision
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          CONSUMER_RESULT: ${{ needs.consumer.result }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          CANDIDATE_REVISION: ${{ github.sha }}
        run: |
          {
           echo "candidate_revision=$CANDIDATE_REVISION"
           echo "repository_tests=$TEST_RESULT"
           echo "package_integrity=$PACKAGE_RESULT"
           echo "consumer_install=$CONSUMER_RESULT"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$TEST_RESULT" != success ] ||
            [ "$PACKAGE_RESULT" != success ] ||
            [ "$CONSUMER_RESULT" != success ]; then
           echo "release_readiness_decision=blocked" | tee -a "$GITHUB_STEP_SUMMARY"
           exit 1
          fi
          if [ "$REF_TYPE" = tag ]; then
           echo "release_validation_decision=ready to publish" | tee -a "$GITHUB_STEP_SUMMARY"
          else
           if [ "$REF_NAME" != main ]; then
             echo "release_readiness_decision=blocked: candidate is not main" |
               tee -a "$GITHUB_STEP_SUMMARY"
             exit 1
           fi
           echo "pre_tag_decision=ready to tag" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
