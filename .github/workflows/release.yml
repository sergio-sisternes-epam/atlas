name: Release Atlas

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    name: Create source release
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify release candidate
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          python3 scripts/release_readiness.py \
            --tag "$GITHUB_REF_NAME" \
            --commit "$tag_commit"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error title=Invalid release tag::Release tags must reference a commit reachable from main."
            exit 1
          fi
          {
            echo "tag=$GITHUB_REF_NAME"
            echo "candidate_revision=$tag_commit"
            echo "main_ancestry=pass"
            echo "release_validation_decision=ready to publish"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          ARGS=(--verify-tag --generate-notes --title "$TAG")
          if python3 scripts/release_readiness.py --is-prerelease-tag "$TAG"; then
            ARGS+=(--prerelease)
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "prerelease=$PRERELEASE (tag $TAG)"
          if state="$(gh release view "$TAG" --json tagName,isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"' 2>/dev/null)"; then
            read -r draft existing <<<"$state"
            if [ "$draft" = true ]; then
              echo "::error title=Release is a draft::GitHub release $TAG exists but is still a draft; publish it (or delete it) and re-run this workflow."
              exit 1
            fi
            if [ "$draft" != false ]; then
              echo "::error title=Unknown release state::Could not read the draft state of GitHub release $TAG (got '$state')."
              exit 1
            fi
            echo "::notice title=Release already exists::GitHub release $TAG already exists and was left unchanged."
            echo "existing_prerelease=$existing expected_prerelease=$PRERELEASE"
            if [ "$existing" != "$PRERELEASE" ]; then
              echo "::warning title=Prerelease flag mismatch::Existing release $TAG has prerelease=$existing; this workflow would have set prerelease=$PRERELEASE."
            fi
            exit 0
          fi
          gh release create "$TAG" "${ARGS[@]}"
