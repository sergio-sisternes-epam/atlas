name: Release Atlas

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    name: Create source release
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify release candidate
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          python3 scripts/release_readiness.py \
            --tag "$GITHUB_REF_NAME" \
            --commit "$tag_commit"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error title=Invalid release tag::Release tags must reference a commit reachable from main."
            exit 1
          fi
          {
            echo "tag=$GITHUB_REF_NAME"
            echo "candidate_revision=$tag_commit"
            echo "main_ancestry=pass"
            echo "release_validation_decision=ready to publish"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Default branch guard (H1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if ! default_branch="$(gh api "repos/$REPO" --jq .default_branch)" ||
            [ -z "$default_branch" ]; then
            echo "::error title=Default branch guard::Could not read the default branch of $REPO; failing closed."
            exit 1
          fi
          if [ "$default_branch" != main ]; then
            echo "::error title=Default branch is not main::The default branch of $REPO is '$default_branch', not main. A default-ref APM install would then ship the docs branch (hard rule H1)."
            exit 1
          fi
          echo "default_branch=main" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Release tree guard (H4)
        id: release-tree-guard
        run: |
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          listing="$(mktemp)"
          if ! git ls-tree -r --name-only -z "$tag_commit" > "$listing"; then
            echo "::error title=Release tree guard::git ls-tree failed for $tag_commit; failing closed."
            exit 1
          fi
          hits=()
          while IFS= read -r -d '' path; do
            case "$path" in
              site | site/*) hits+=("$path") ;;
              *)
                # DOCS_BRANCH* is the docs-branch marker file convention.
                case "${path##*/}" in
                  DOCS_BRANCH*) hits+=("$path") ;;
                esac
                ;;
            esac
          done < "$listing"
          if [ "${#hits[@]}" -gt 0 ]; then
            echo "Offending paths in $GITHUB_REF_NAME ($tag_commit):"
            printf '%s\n' "${hits[@]}"
            echo "::error title=Release tree contains site/::Tag $GITHUB_REF_NAME contains site/ or DOCS_BRANCH* files, which belong only on the orphan docs branch. APM installs the whole tree of a tag, so this release must not be published."
            exit 1
          fi
          {
            echo "tag=$GITHUB_REF_NAME"
            echo "release_tree_guard=pass"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          ARGS=(--verify-tag --generate-notes --title "$TAG")
          if python3 scripts/release_readiness.py --is-prerelease-tag "$TAG"; then
            ARGS+=(--prerelease)
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "prerelease=$PRERELEASE (tag $TAG)"
          if state="$(gh release view "$TAG" --json tagName,isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"' 2>/dev/null)"; then
            read -r draft existing <<<"$state"
            if [ "$draft" = true ]; then
              echo "::error title=Release is a draft::GitHub release $TAG exists but is still a draft; publish it (or delete it) and re-run this workflow."
              exit 1
            fi
            if [ "$draft" != false ]; then
              echo "::error title=Unknown release state::Could not read the draft state of GitHub release $TAG (got '$state')."
              exit 1
            fi
            echo "::notice title=Release already exists::GitHub release $TAG already exists and was left unchanged."
            echo "existing_prerelease=$existing expected_prerelease=$PRERELEASE"
            if [ "$existing" != "$PRERELEASE" ]; then
              echo "::warning title=Prerelease flag mismatch::Existing release $TAG has prerelease=$existing; this workflow would have set prerelease=$PRERELEASE."
            fi
            exit 0
          fi
          gh release create "$TAG" "${ARGS[@]}"

  notify-docs:
    name: Dispatch docs-site build (T1)
    needs: release
    # T1 disabled until the orphan docs branch exists (Atlas docs plan P1b); remove this line to enable.
    if: false
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch docs-site.yml on the docs branch
        env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_TAG: ${{ github.ref_name }}
        run: |
          gh workflow run docs-site.yml --repo "$GITHUB_REPOSITORY" --ref docs -f atlas_tag="$ATLAS_TAG"
