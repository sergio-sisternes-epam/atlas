id: four-level-disclosure-adversarial-v1
packages: [atlas]
work_id: 2026-10-04-four-level-disclosure
adversarial: true
smokes:
  - id: recall-early-stop
    source: "references/paths/recall.md; SKILL.md"
    expect: "Recall follows index → schema → gist → memory, descends only when the current level does not answer, and never opens a lower level after a hit. hub.md is not a memory level."
  - id: index-is-schema-cues
    source: "references/paths/recall.md; references/paths/remember.md"
    expect: "index.md is the OKF reserved directory listing and hot schema-cue list, not Cowan STM, copied memory, a table of contents, or a hot list of every gist. A schema must be cued from its own folder index."
  - id: remember-cascade-and-subject-change
    source: "references/paths/remember.md"
    expect: "New or contradicted memories cascade to their owning gist and schema. One writer per folder; do not rewrite sibling schemas. When a live branch subject changes, add <name>.schema.md, link same-level to the prior schema, list the new schema on index.md, and leave hub.md in place."
  - id: current-shape-suffixes
    source: "references/templates/schema.md; references/paths/remember.md"
    expect: "Current CONTRACT.json pages use .schema.md, .gist.md, and .memory.md as search handles only; frontmatter type remains schema, gist, or memory. Index and hub filenames remain unsuffixed."
  - id: closed-current-compile-gates
    source: "scripts/atlas_cli/commands/validate.py"
    expect: "Current shape fails for uncovered folder gists (gist_without_schema/schema_folder), schemas not cued by local index.md (schema_missing_from_index), and gist descriptions not found as exact substrings in derived memory body or description (stale_upper_page). Multiple schemas and schema-only folders are not compile failures."
  - id: shipped-beta-compatibility
    source: "scripts/atlas_cli/commands/validate.py; references/templates/frame.md"
    expect: "Shipped SCHEMA.json stores keep existing page type names and frame_members info/warn/error ladder; no current-shape schema gate is imposed on them."
  - id: memory-migrate-suffix-stack
    source: "scripts/atlas_cli/commands/memory_migrate.py; references/paths/memory-migrate.md"
    expect: "Migration builds current-shape suffix pages, allows additional schemas for new subjects, adds schema cues to index.md, and preserves stamp behavior. One gist still requires coverage by a schema."
  - id: package-and-store-versions
    source: "apm.yml; SKILL.md; scripts/atlas_cli/__init__.py; scripts/atlas_cli/core/schema.py"
    expect: "Package surfaces and current store write stamp are 0.13.0-beta.7; beta.3 and beta.4 current readers remain accepted, unknown stamps fail closed, and malformed stamps do not match by prefix."
