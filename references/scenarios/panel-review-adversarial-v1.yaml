id: panel-review-adversarial-v1
work_id: 2026-09-03-pr-panel-review
adversarial: true
packages: [atlas]
expect:
  one_skill_dir: true
  apm_source_package: true
  copilot_deployment: true
  lazy_lenses: true
  skip_python_on_docs: true
  no_merge_gate_language: true
  dispatch_name_panel_review: true
smokes:
  - id: apm-source-package
    source: operator correction 2026-09-03
    expect: source lives under .apm/skills/panel-review and root apm.yml declares a hybrid package
  - id: copilot-deployment
    source: operator correction 2026-09-03
    expect: apm install --target copilot deploys panel-review for Copilot
  - id: one-skill-not-four
    source: A1 PANEL-WITHOUT-SYNTHESIS / pin 3
    expect: exactly one SKILL.md for the panel; no per-lens SKILL.md
  - id: lenses-not-inlined
    source: C1 EAGER BLOAT / CCR tutorial context limits
    expect: SKILL.md does not contain the full text of any lens file
  - id: docs-only-skips-python-cli
    source: B2 skip rules / pin roster
    expect: roster.md skip python-cli when diff is markdown-only under docs/README/recipes
  - id: no-approve-reject
    source: advisory regime / deprecated panel-review
    expect: SKILL.md and synthesizer.md contain no APPROVE/REJECT merge-gate instruction
  - id: dispatch-name-panel-review
    source: operator correction 2026-09-03
    expect: source directory and SKILL.md name are panel-review
  - id: inline-plus-summary-table
    source: operator 2026-09-03 output format
    expect: SKILL.md requires inline comments plus one summary; synthesizer.md has Blocker/Recommended/Nits table and per-lens details
