id: credential-host-scope-adversarial-v1
work_id: 2026-09-05-atlas-credential-host-scope
adversarial: true
packages: [atlas]
expect:
  environment_credentials_are_host_scoped: true
  arbitrary_hosts_are_anonymous: true
  gh_fallback_is_host_scoped: true
  credentials_not_persisted: true
  failures_redacted: true
smokes:
  - id: generic-token-rejected-for-arbitrary-host
    source: discuss PR 6 panel finding discussion_r3941430064
    expect: attacker.example receives no Atlas or GitHub environment credential
  - id: github-cloud-token-supported
    source: GitHub CLI environment host contract
    expect: github.com and subdomains of ghe.com accept public GitHub token variables
  - id: ghes-token-requires-host-match
    source: GitHub CLI GH_HOST and enterprise token contract
    expect: GHES environment tokens are accepted only when GH_HOST exactly matches
  - id: stored-gh-token-is-host-scoped
    source: gh auth token --hostname contract
    expect: gh lookup and credential helper run without overriding token environment variables
  - id: arbitrary-host-shared-operations-are-anonymous
    source: shared gitops call graph
    expect: clone, submodule add, and submodule update disable credential helpers and scrub token variables
  - id: token-config-is-process-local
    source: v0.8.14 explicit-token process boundary
    expect: an authorized token uses only per-process Git configuration
  - id: token-error-is-redacted
    source: v0.8.14 least-exposure contract
    expect: a token echoed by Git stderr is returned only as three asterisks
