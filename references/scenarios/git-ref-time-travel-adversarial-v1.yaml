id: git-ref-time-travel-adversarial-v1
packages: [atlas]
work_id: 2026-09-27-git-backed-versions
adversarial: true
expect:
  absent_ref_is_tip: true
  present_ref_is_not_compiled: true
  history_edge_is_not_a_live_edge: true
smokes:
  - id: compile-fence
    source: "relates_to.ref; absent ref is tip; present ref is not resolved at compile"
    expect: "Absent ref is tip and the target must exist on HEAD. A present ref is a git rev, not a mount ref. Compile does not resolve that rev and does not fail because the path is gone from tip."
  - id: tip-exclusion
    source: "projection and search omit ref edges; live kind contracts ignore them"
    expect: "A relates_to item with ref does not satisfy a live kind, parent, or frame-member contract. Projection and search omit that edge. A writer that needs a live link must not treat the history item as the live gist link."
  - id: history-recovery
    source: "atlas ref show; atlas ref prune history edges"
    expect: "atlas ref show prints a store path at a git rev and refuses a path that escapes the store. atlas ref prune drops named tip pages, retargets inbound tip links to one summary, and keeps the pre-prune snapshot on that summary's ref edges. It does not commit. A drop rename that moves a different inode keeps the checked bytes in a recovery file and puts the other file back. A restore link that loses the destination keeps the checked temp."
