# Copy to an Atlas mount as .github/workflows/atlas-compile.yml.
# Set ATLAS_ROOT for embedded stores and pin ATLAS_REF to an Atlas tag or SHA.
name: Atlas compile

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    env:
      ATLAS_ROOT: .
      ATLAS_REF: v0.8.13
      ATLAS_REPO: sergio-sisternes-epam/atlas
    steps:
      - name: Checkout mount
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require Atlas root
        env:
          ROOT: ${{ env.ATLAS_ROOT }}
        run: test -f "$ROOT/SCHEMA.json"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Acquire pinned Atlas CLI
        env:
          ATLAS_TOKEN: ${{ secrets.ATLAS_CLI_TOKEN || github.token }}
        run: |
          case "$ATLAS_REF" in
            main|master|"")
              echo "ATLAS_REF must be a tag or 40-character commit SHA" >&2
              exit 2
              ;;
          esac
          if ! [[ "$ATLAS_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            encoded_ref="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["ATLAS_REF"], safe=""))')"
            curl --fail --location --silent --show-error \
              --header "Authorization: Bearer $ATLAS_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$ATLAS_REPO/git/ref/tags/$encoded_ref" \
              --output /dev/null
          fi
          cli_dir="$(mktemp -d "$RUNNER_TEMP/atlas-cli.XXXXXX")"
          archive="$RUNNER_TEMP/atlas-cli.tar.gz"
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $ATLAS_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$ATLAS_REPO/tarball/$ATLAS_REF" \
            --output "$archive"
          tar -xzf "$archive" --strip-components=1 --directory "$cli_dir"
          echo "ATLAS_CLI=$cli_dir" >> "$GITHUB_ENV"

      - name: Install Atlas CLI dependencies
        run: python3 -m pip install -r "$ATLAS_CLI/scripts/requirements.txt"

      - name: Compile Atlas
        id: atlas
        env:
          ROOT: ${{ env.ATLAS_ROOT }}
        run: |
          set +e
          python3 "$ATLAS_CLI/scripts/atlas.py" compile \
            --root "$ROOT" --json > atlas-compile.json
          status=$?
          set -e
          python3 -m json.tool atlas-compile.json >/dev/null
          cat atlas-compile.json
          echo "compile_exit=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ge 2 ]; then
            exit "$status"
          fi
          if [ "$status" -eq 1 ]; then
            echo "::warning::Atlas compile completed with warnings"
          fi

      - name: Upload compile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-compile-json
          path: atlas-compile.json
          if-no-files-found: warn
