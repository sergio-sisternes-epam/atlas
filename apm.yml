name: atlas
version: 0.12.0
description: Durable OKF v0.2 knowledge substrate for process memory, schema governance, project knowledge graphs, and canonical CI gates on Atlas mounts. Successor to okf-wiki operational layer. Format authority remains okf.
author: Sergio Sisternes
license: Apache-2.0
homepage: https://github.com/sergio-sisternes-epam/atlas
repository: https://github.com/sergio-sisternes-epam/atlas
keywords:
  - knowledge-management
  - knowledge-graph
  - agent-memory
  - okf
type: hybrid
includes:
  - .apm/skills/code-review/
  - .apm/skills/panel-review/
dependencies:
  apm:
    - name: okf
      marketplace: atlas
  python:
    - jsonschema>=4.0
    - click>=8.0
